<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShop</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="ex.css">
</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="#">MyShop</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Products</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- Slider -->

<div class="slider">

    <div class="slides">

        <img src="https://picsum.photos/id/1015/1200/350">

        <img src="https://picsum.photos/id/1040/1200/350">

        <img src="https://picsum.photos/id/1050/1200/350">

    </div>

    <div class="next">
        <i class="bi bi-chevron-right"></i>
    </div>

</div>

<!-- Products -->

<div class="container my-5">

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card shadow">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCt0QXScDtHvqPkezVqFfcx4QSogjwQj3rDVU7rOFJZA&s=10" class="card-img-top">

                <div class="card-body text-center">

                    <h5>Headphones</h5>

                    <p class="text-success fs-5">₹999</p>

                    <button class="btn btn-warning">Buy Now</button>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow">

                <img src="https://gourban.in/cdn/shop/files/Pulse.jpg?v=1749553994&width=2048" class="card-img-top">

                <div class="card-body text-center">

                    <h5>Watch</h5>

                    <p class="text-success fs-5">₹1499</p>

                    <button class="btn btn-warning">Buy Now</button>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow">

                <img src="https://m.media-amazon.com/images/I/71pl8w5xXJL._AC_UY1000_.jpg" class="card-img-top">

                <div class="card-body text-center">

                    <h5>Shoes</h5>

                    <p class="text-success fs-5">₹1999</p>

                    <button class="btn btn-warning">Buy Now</button>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->

<footer class="bg-dark text-white text-center p-3">

    © 2026 MyShop | All Rights Reserved

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
